# ArchFlux nginx frontend + API reverse proxy (Agent C).
# Upstream is the compose service DNS name `server` — never localhost, so this
# file works unchanged in any compose network. API contract: /api/* on the
# backend (see server/ owned by Agent A).
#
# Runtime DNS (variable + embedded resolver) instead of a static `upstream`
# block: nginx resolves `server` per-request and re-resolves every 10s, so the
# container boots and self-heals across API restarts/recreates instead of
# crash-looping on "host not found in upstream". Requires a Docker
# user-defined network (compose always provides one: 127.0.0.11).

server {
  listen 80;
  server_name _;

  # Runtime DNS for the API upstream (see note above).
  resolver 127.0.0.11 valid=10s;
  set $api_backend http://server:3001;

  root /usr/share/nginx/html;
  index index.html;

  # Basic hardening headers for a static SPA behind a proxy.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Compress text assets (directive is legal in server/location context).
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Reverse-proxy the API. $api_backend carries no URI, so the full original
  # request URI is passed through unchanged:
  # /api/v1/diagrams -> http://server:3001/api/v1/diagrams.
  location /api/ {
    proxy_pass $api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # The API enforces its own ~1 MB JSONB body cap (413); nginx allows a
    # little headroom so the API — not the proxy — returns the typed error.
    client_max_body_size 2m;
  }

  # Runtime-injectable frontend config (generated at container start from
  # $API_URL by docker/config-json.sh; consumed by Phase-2 frontend wiring).
  # Never cached: it is environment, not a build artifact.
  location = /config.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # SPA fallback: static file, else directory index, else index.html.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
