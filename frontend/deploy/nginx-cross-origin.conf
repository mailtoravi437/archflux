# Nginx config for SEPARATE frontend/backend (cross-origin / no same-origin /api proxy)
# Use when frontend is served separately (e.g., CDN, S3, static host) and backend is at separate domain.
# Place at: /etc/nginx/sites-available/default (static host) or use in the Docker web container.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    # Security headers (repeated in each location that uses add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.archflux.example.com wss://api.archflux.example.com; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # NO /api/ proxy here — backend is at external URL (e.g., https://api.archflux.example.com)
    # The frontend (built with VITE_API_URL=https://api.archflux.example.com/api) connects directly.

    # Cache: never for index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Aggressive cache for hashed static assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
