# archflux-web nginx (SERVICES_SPEC §3). Serves the static SPA. The API proxy
# and CSP connect-src are runtime-generated by docker/40-archflux-runtime.sh:
#   /etc/nginx/archflux/runtime.conf    — `set $archflux_csp ...` (server level)
#   /etc/nginx/archflux/api-proxy.conf  — /api /ws /oauth2 /saml2 proxy when
#                                         API_UPSTREAM is set (integrated
#                                         topology), empty otherwise.
# NOTE: every location with its own add_header must repeat the security
# headers — nginx drops inherited add_headers for that location.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/archflux/runtime.conf;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy $archflux_csp always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  include /etc/nginx/archflux/api-proxy.conf;

  # Runtime-injectable frontend config (never cached: environment, not build).
  location = /config.json {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $archflux_csp always;
    try_files $uri =404;
  }

  # Hashed build assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $archflux_csp always;
    try_files $uri =404;
  }

  # SPA fallback: static file, else directory index, else index.html.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $archflux_csp always;
    try_files $uri $uri/ /index.html;
  }
}
