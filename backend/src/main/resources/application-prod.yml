# Production profile overrides — never commit real secrets.
# Use the secret manager or env vars set by the deployment platform.
spring:
  profiles:
    active: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_APP_USER:archflux_app}
    password: ${DB_APP_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  api-token: ${APP_API_TOKEN}
  cookie-secure: true
  frontend-url: ${FRONTEND_URL}
  public-api-url: ${PUBLIC_API_URL:}
  # Prod: exactly the configured origins — never the local dev defaults.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}
  email:
    provider: ${EMAIL_PROVIDER:sendgrid}

logging:
  level:
    com.archflux: INFO

# OpenAPI document + Swagger UI are build/dev tooling; never public in prod (SVC-G30).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
