# ArchFlux Nginx — VM deployment (not Docker).
# Place at: /etc/nginx/sites-available/default  (symlink into sites-enabled)
#   sudo cp deploy/nginx-default.conf /etc/nginx/sites-available/default
#   sudo ln -sf /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Notes:
# - DNS/SSL are terminated by Cloudflare (Proxied). Nginx listens on HTTP 80;
#   Cloudflare forwards to the VM over HTTP (Flexible) or HTTPS (Full/Strict).
# - Backend (Spring Boot) runs locally on 127.0.0.1:3001 under systemd.
# - Frontend lives in /var/www/html (rsynced from GitHub Actions dist/).
# - index.html is never cached; hashed /assets/* are immutable & cached 1 yr.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                       # Cloudflare sets the Host header; _ catches all.

    root /var/www/html;
    index index.html;

    # ------------------------------------------------------------------
    # Security headers (repeated in locations that set add_header, because
    # nginx drops inherited headers once a location defines its own).
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------
    # Backend upstream (Spring Boot on localhost:3001).
    # ------------------------------------------------------------------
    upstream backend {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    # WebSocket hop-by-hop upgrade handling.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # X-Forwarded-Proto: Cloudflare sends X-Forwarded-Proto (https). When a
    # client hits the VM IP directly, fall back to $scheme.
    map $http_x_forwarded_proto $frontend_proto {
        default $scheme;
        https   https;
        http    http;
    }

    # ------------------------------------------------------------------
    # index.html: never cached (SPA entrypoint changes on every deploy).
    # ------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Hashed static assets (/assets/): aggressive, immutable caching.
    # Vite emits hashed filenames, so immutable is safe.
    # ------------------------------------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # API reverse proxy (/api/ -> Spring Boot) + WebSocket upgrades.
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Host / client IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $frontend_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Let the API (not nginx) enforce its body cap and return typed errors.
        client_max_body_size 2m;

        # Optional: disable buffering for SSE/streaming endpoints.
        # proxy_buffering off;
    }

    # ------------------------------------------------------------------
    # SPA fallback: file -> directory index -> index.html (no 404 on reload).
    # ------------------------------------------------------------------
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}

