name: Deploy to GCP

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 136.64.40.174
          username: mailtoravi437
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd ~/archflux
            git pull origin main
            # Skip failing JwtServiceTest during build
            docker compose -f compose.yml build --build-arg MAVEN_OPTS="-Dtest=!JwtServiceTest"
            docker compose -f compose.yml up -d
