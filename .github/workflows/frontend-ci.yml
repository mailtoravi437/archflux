# archflux-web CI (SERVICES_SPEC §6). Runs only when the frontend service or
# the integrated compose file changes; needs no JDK/Maven.
name: frontend-ci

on:
  push:
    paths: ['frontend/**', 'compose.yml', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['frontend/**', 'compose.yml', '.github/workflows/frontend-ci.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build archflux-web image (own context only)
        run: docker build -t archflux-web:ci .
      - name: Validate compose files
        working-directory: .
        run: |
          docker compose -f frontend/compose.yml config --quiet
          docker compose -f compose.yml config --quiet
