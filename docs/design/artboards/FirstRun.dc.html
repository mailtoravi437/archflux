<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ArchFlux — First run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4338CA}a:hover{color:#312E81}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #F6F7F9; color: #1B1F27; font-family: Inter, system-ui, sans-serif; font-size: 13px; overflow: hidden">
  <dc-import name="AppBar" active="Canvas" doc="untitled.arch" status="Saved" hint-size="1440px,48px"></dc-import>
  <div style="flex-grow: 1; position: relative; background-color: #FFFFFF; background-image: radial-gradient(#DADDE3 1px, transparent 1px); background-size: 20px 20px">
    <!-- empty state -->
    <section aria-label="Empty canvas" style="position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: 560px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
      <h1 style="margin: 0; font-size: 20px; font-weight: 700">Start your first diagram</h1>
      <p style="margin: 0; color: #5B6474">Pick a starting point — you can change everything later.</p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%">
        <a href="NewDiagram.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 16px; border: 1px solid #E3E6EB; border-radius: 12px; background: #FFFFFF; text-decoration: none; color: inherit; text-align: left"><strong>Describe it</strong><span style="color: #5B6474">AI drafts it, you review</span></a>
        <a href="NewDiagram.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 16px; border: 1px solid #E3E6EB; border-radius: 12px; background: #FFFFFF; text-decoration: none; color: inherit; text-align: left"><strong>Use a template</strong><span style="color: #5B6474">40 architecture blueprints</span></a>
        <a href="ImportMap.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 16px; border: 1px solid #E3E6EB; border-radius: 12px; background: #FFFFFF; text-decoration: none; color: inherit; text-align: left"><strong>Import</strong><span style="color: #5B6474">draw.io, Mermaid, Lucid CSV</span></a>
        <a href="Main.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 16px; border: 1px solid #E3E6EB; border-radius: 12px; background: #FFFFFF; text-decoration: none; color: inherit; text-align: left"><strong>Draw it</strong><span style="color: #5B6474">Press S for a service, then click</span></a>
      </div>
    </section>

    <!-- checklist -->
    <section aria-label="Getting started" style="position: absolute; right: 20px; bottom: 20px; width: 320px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; box-shadow: 0 16px 40px rgba(16,24,40,.12); padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center"><span style="font-weight: 700; flex-grow: 1">Get started · 2 of 6</span><button aria-label="Dismiss checklist" style="width: 28px; height: 28px; border: none; background: transparent; color: #5B6474; font-size: 16px">×</button></div>
      <span style="height: 6px; border-radius: 3px; background: #EEF0F3; overflow: hidden"><span style="display: block; width: 33%; height: 100%; background: #4F46E5"></span></span>
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 20px; height: 20px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: {{s.bg}}; color: {{s.fg}}; border: {{s.border}}">{{s.mark}}</span>
          <span style="flex-grow: 1; color: {{s.text}}; text-decoration: {{s.deco}}">{{s.label}}</span>
          <span style="font-size: 11px; color: #5B6474">{{s.note}}</span>
        </div>
      </sc-for>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const done = { mark: '✓', bg: '#DCF3E6', fg: '#047857', border: 'none', text: '#5B6474', deco: 'line-through' };
    const todo = { mark: '', bg: '#FFFFFF', fg: '#5B6474', border: '1.5px solid #C3C8D1', text: '#1B1F27', deco: 'none' };
    return {
      steps: [
        { label: 'Create a diagram', note: '', ...done },
        { label: 'Add 5 elements', note: '', ...done },
        { label: 'Connect two elements', note: 'Drag from a port', ...todo },
        { label: 'Invite a teammate', note: '', ...todo },
        { label: 'Share or publish', note: '', ...todo },
        { label: 'Connect GitHub', note: 'Team', ...todo }
      ]
    };
  }
}
</script>
</body>
</html>
