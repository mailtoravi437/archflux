# ArchFlux server configuration.
# DDL lives exclusively in db/ (manual psql). Hibernate NEVER creates schema.
server:
  port: ${PORT:3001}
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        http-only: true
        max-age: 2592000 # 30 days

spring:
  main:
    lazy-initialization: true
  mvc:
    throw-exception-if-no-handler-found: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      initialization-fail-timeout: 0
      connection-timeout: 3000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    repositories:
      bootstrap-mode: lazy
    properties:
      hibernate:
        timezone:
          default_storage: NORMALIZE_UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # OAuth2 / OIDC / SAML2 (single security key — YAML last-wins would drop oauth2 otherwise)
  # Client ids/secrets default to non-functional placeholders so Boot's
  # registration validation passes and the server boots without operator SSO
  # material. Provider login is NOT usable until real credentials are set via
  # env (see DEPLOY.md SSO section) — the provider will reject the placeholder.
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:changeme-configure-GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET:changeme-configure-GITHUB_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/github"
            scope: read:user,user:email,repo
            authorization-grant-type: authorization_code
            client-name: GitHub
          google:
            client-id: ${GOOGLE_CLIENT_ID:changeme-configure-GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:changeme-configure-GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: openid,email,profile
            authorization-grant-type: authorization_code
            client-name: Google
            provider: google
          oidc:
            client-id: ${OIDC_CLIENT_ID:changeme-configure-OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET:changeme-configure-OIDC_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/oidc"
            scope: openid,email,profile
            authorization-grant-type: authorization_code
            client-name: SSO
            provider: oidc
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: sub
          # Keycloak-shaped placeholder endpoints (static strings — no
          # discovery I/O at startup). Point OIDC_ISSUER_URI at a real
          # issuer and set OIDC_CLIENT_ID/SECRET for a working SSO login.
          oidc:
            authorization-uri: ${OIDC_ISSUER_URI:https://auth.example.com/realms/archflux}/protocol/openid-connect/auth
            token-uri: ${OIDC_ISSUER_URI:https://auth.example.com/realms/archflux}/protocol/openid-connect/token
            user-info-uri: ${OIDC_ISSUER_URI:https://auth.example.com/realms/archflux}/protocol/openid-connect/userinfo
            jwk-set-uri: ${OIDC_ISSUER_URI:https://auth.example.com/realms/archflux}/protocol/openid-connect/certs
            user-name-attribute: sub
    saml2:
      relyingparty:
        registration:
          archflux:
            entity-id: ${SAML_ENTITY_ID:https://archflux.example.com}
            assertion-consumer-service:
              location: "{baseUrl}/login/saml2/sso/archflux"
              binding: POST
            singlelogout:
              url: "{baseUrl}/logout/saml2/slo"
              binding: REDIRECT
            signing:
              credentials:
                # DEV-ONLY placeholder (sso-dev/) so the server boots without
                # operator SSO material. Real deployments MUST set
                # SAML_PRIVATE_KEY_LOCATION / SAML_CERT_LOCATION (Release D).
                - private-key-location: ${SAML_PRIVATE_KEY_LOCATION:classpath:/sso-dev/archflux-sp.key}
                  certificate-location: ${SAML_CERT_LOCATION:classpath:/sso-dev/archflux-sp.crt}
            assertingparty:
              entity-id: ${SAML_IDP_ENTITY_ID:https://dev-123456.okta.com}
              singlesignon:
                url: ${SAML_IDP_SSO_URL:https://dev-123456.okta.com/app/archflux/sso/saml}
                binding: POST
              singlelogout:
                url: ${SAML_IDP_SLO_URL:https://dev-123456.okta.com/app/archflux/slo/saml}
                binding: REDIRECT
              verification:
                credentials:
                  # DEV-ONLY placeholder (see above). Replace with the real
                  # IdP certificate or SAML verification fails closed.
                  - certificate-location: ${SAML_IDP_CERT_LOCATION:classpath:/sso-dev/archflux-sp.crt}

  # Redis for session storage & magic link tokens
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # Session storage in Redis
  session:
    store-type: redis
    redis:
      namespace: "archflux:sessions:"
      flush-mode: on_save
    timeout: 30d

app:
  api-token: ${APP_API_TOKEN:${API_TOKEN:}}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt-secret: ${JWT_SECRET:dev-only-not-a-production-secret-set-JWT_SECRET-in-prod-0123456789}
  jwt-issuer: ${JWT_ISSUER:archflux}
  jwt-audience: ${JWT_AUDIENCE:archflux-api}
  # Previous HS256 secret accepted during key rotation (empty = no rotation key).
  jwt-prev-secret: ${JWT_PREV_SECRET:}
  # Secure flag for the ARCHFLUX_TOKEN cookie (dev/compose sets false for plain HTTP).
  cookie-secure: ${APP_COOKIE_SECURE:true}
  magic-link-ttl-minutes: 15

  # Magic link email service
  email:
    provider: ${EMAIL_PROVIDER:mock} # mock, sendgrid, resend, ses
    from: ${EMAIL_FROM:noreply@archflux.io}
    sendgrid-api-key: ${SENDGRID_API_KEY:}
    resend-api-key: ${RESEND_API_KEY:}

logging:
  level:
    com.archflux: INFO
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.engine.jdbc.env.internal.JdbcEnvironmentInitiator: WARN