# Test configuration — PostgresIT owns schema via real V1 migration;
# Flyway off, Hibernate validate-only, no Redis/session, no external OAuth.
spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    store-type: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test
            client-secret: test
          google:
            client-id: test
            client-secret: test
            provider: google
        provider:
          google:
            issuer-uri: https://accounts.google.com

app:
  api-token: test-token
  jwt-secret: test-secret-that-is-long-enough-for-hs256-0123456789abcdef

logging:
  level:
    com.archflux: DEBUG
    org.hibernate.engine.jdbc.env.internal.JdbcEnvironmentInitiator: WARN
    org.springframework.test: DEBUG
