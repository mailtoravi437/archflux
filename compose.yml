# ArchFlux INTEGRATED topology (SERVICES_SPEC §5.1): same-origin, the web
# container reverse-proxies /api, /ws and the OAuth/SAML paths to the API.
# Service definitions live with each service; this file only composes them.
#   Prod:  docker compose -f compose.yml up -d --build   (skips dev override)
#   Dev:   docker compose up -d db redis                 (override publishes postgres)
# Separate topology instead: backend/compose.yml + frontend/compose.yml.
name: archflux

services:
  db:
    extends: { file: backend/compose.yml, service: db }
    # Integrated prod keeps postgres off the host network; compose.override.yml re-publishes it for dev.
    ports: !reset []

  redis:
    extends: { file: backend/compose.yml, service: redis }

  server:
    extends: { file: backend/compose.yml, service: server }
    environment:
      # Browser origin is the web container; emailed links go through its /api proxy.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${WEB_PORT:-8080}}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:${WEB_PORT:-8080}/api}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    extends: { file: frontend/compose.yml, service: web }
    environment:
      API_URL: /api
      WS_URL: ""
      API_UPSTREAM: http://server:3001
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
