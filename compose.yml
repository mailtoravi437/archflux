# ArchFlux compose stack (Agent C).
# Prod:  docker compose -f compose.yml up -d --build   (skips dev override)
# Dev:   docker compose up -d db   (override publishes postgres for `npm run dev`)
# E2E:   docker compose -p archflux-e2e up -d --build
name: archflux

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archflux}
      POSTGRES_USER: ${POSTGRES_USER:-archflux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres-pw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-archflux} -d $${POSTGRES_DB:-archflux}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  server:
    build:
      context: ./server
    image: archflux-server:local
    restart: unless-stopped
    # init for correct SIGTERM forwarding / zombie reaping.
    init: true
    stop_grace_period: 30s
    ports:
      - "${SERVER_PORT:-3001}:3001"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      PORT: 3001
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/${POSTGRES_DB:-archflux}}
      SPRING_DATASOURCE_USERNAME: ${DB_APP_USER:-archflux_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD:-dev-app-only}
      APP_API_TOKEN: ${API_TOKEN:-dev-token}
      "spring.flyway.enabled": "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # curl probe (installed in the server image); image also bakes its own HEALTHCHECK.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: archflux-web:local
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      # Runtime API base for /config.json (Phase-2 frontend reads it).
      API_URL: ${VITE_API_URL:-/api}
    depends_on:
      server:
        condition: service_healthy
    # Healthcheck is baked into the image (Dockerfile.web HEALTHCHECK).

volumes:
  pgdata:
