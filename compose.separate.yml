# Separate deployment: frontend (static) + backend (API) independently managed.
# Use when you want to deploy/update one without the other.
# Example: deploy backend jar independently; deploy frontend dist/ independently.

name: archflux-separate

services:
  # Backend runs independently (port mapped externally for direct access or via nginx proxy)
  server:
    build:
      context: ./server
    image: archflux-server:separate
    container_name: archflux-server-sep
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 3001
      SPRING_DATASOURCE_URL: ${DATABASE_URL:-jdbc:postgresql://db:5432/archflux}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-archflux_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-K/aoUfN7OxZlq5x9AY43IdtruUYuOhjl}
      APP_API_TOKEN: ${API_TOKEN:-f506189f13b9ff61e04350a8bd983008}
      JWT_SECRET: ${JWT_SECRET:-d5150374db41aa7b1bf23957bb3294c56d9bb94e7ef3e4358b4021ba96658c56}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      REDIS_HOST: redis
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    env_file:
      - .env
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Database (shared by backend only; frontend has no DB dependency)
  db:
    image: postgres:15-alpine
    container_name: archflux-db-sep
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archflux}
      POSTGRES_USER: ${POSTGRES_USER:-archflux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-d5150374db41aa7b1bf23957bb3294c56d9bb94e7ef3e4358b4021ba96658c56}
      DB_APP_USER: ${DB_APP_USER:-archflux_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-K/aoUfN7OxZlq5x9AY43IdtruUYuOhjl}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-archflux} -d $${POSTGRES_DB:-archflux}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Redis (shared by backend)
  redis:
    image: redis:7-alpine
    container_name: archflux-redis-sep
    restart: unless-stopped
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Frontend runs independently; connects to backend via external/proxy URL (not same-origin /api here)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: archflux-web:separate
    container_name: archflux-web-sep
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      API_URL: ${VITE_API_URL:-/api}
    networks:
      - frontend-net
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:

# Separate networks: backend services don't share network with frontend directly.
# If you need same-origin proxy (/api -> server), add nginx proxy container or configure external URL.
networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge
